  </button>

<div class="progress" aria-hidden="true"><i></i><i></i><i></i><i></i></div>

<main id="experience">

  <!-- 1 · Welcome -->
  <section class="scene scene-welcome is-active" aria-labelledby="h-welcome">
    <div class="ring" aria-hidden="true"><span>✦</span></div>
    <p class="eyebrow" id="welcomeEyebrow" data-i18n="welcomeEyebrow">একটি বিশেষ দিন</p>
    <h1 id="h-welcome" class="bound" data-i18n="welcomeHeading">উদযাপনের মতো একটি দিন।</h1>
    <p class="lead" id="welcomeLead"></p>
    <button type="button" class="btn btn-primary" id="openJar" data-i18n="openJar">স্মৃতির বয়াম খুলুন</button>
  </section>

  <!-- 2 · The memory jar -->
  <section class="scene scene-jar" aria-labelledby="h-jar">
    <p class="eyebrow" data-i18n="jarEyebrow">বয়ামের ভেতরে</p>
    <h2 id="h-jar" data-i18n="jarHeading">তিনটি কার্ড তোলো।</h2>
    <div class="jar" aria-hidden="true"><span class="jar-lid"></span><span class="jar-body"><i></i><i></i><i></i><i></i><i></i></span></div>
    <button type="button" class="btn btn-primary" id="drawBtn"></button>
    <ol class="cards" id="cards" aria-live="polite"></ol>
    <button type="button" class="btn btn-primary" id="toMessage" hidden data-i18n="toMessage">শুভেচ্ছাটি পড়ুন</button>
  </section>

  <!-- 3 · The message -->
  <section class="scene scene-message" aria-labelledby="h-message">
    <p class="eyebrow" data-i18n="messageEyebrow">কয়েকটি কথা</p>
    <h2 id="h-message" class="bound" data-i18n="messageHeading">শুভ বার্ষিকী</h2>
    <article class="scroll">
      <p class="msg-for bound" data-i18n="messageFor">প্রিয়,</p>
      <p class="msg-text user-text" data-bind="message"></p>
      <p class="signed bound" data-bind="from" hidden></p>
    </article>
    <button type="button" class="btn btn-primary" id="toToast" data-i18n="toToast">এবার একটু উদযাপন</button>
  </section>

  <!-- 4 · Toast and final -->
  <section class="scene scene-toast" aria-labelledby="h-toast">
    <p class="eyebrow" data-i18n="toastEyebrow">শেষ একটি কাজ</p>
    <h2 id="h-toast" data-i18n="toastHeading">গ্লাস তোলার সময়।</h2>
    <button type="button" class="glass-btn" id="toastBtn" aria-pressed="false"><span aria-hidden="true">🥂</span><span id="toastBtnText"></span></button>
    <div class="spark" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <p class="final-line" id="finalLine" aria-live="polite"></p>
    <div class="actions">
      <button type="button" class="btn btn-primary" id="shareBtn" data-i18n="shareBtn">এই শুভেচ্ছাটি শেয়ার করুন</button>
      <button type="button" class="btn btn-ghost" id="replayBtn" data-i18n="replayBtn">আবার দেখুন</button>
    </div>
    <nav class="wish-links" data-i18n-aria-label="moreNav" aria-label="Wishora-র আরও">
      <a href="../../" data-i18n="linkHome">Wishora হোম</a>

    </nav>
  </section>
